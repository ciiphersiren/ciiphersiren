<text x="40" y="106" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1f5fa8">1</text><text x="80" y="106" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ffd85c">languages </tspan><tspan fill="#8fb3d9">= [</tspan><tspan fill="#eef8ff">"Python"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"JavaScript"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"MATLAB"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Java"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"C"</tspan><tspan fill="#8fb3d9">]</tspan></text><text x="40" y="144" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1f5fa8">2</text><text x="80" y="144" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ffd85c">ml        </tspan><tspan fill="#8fb3d9">= [</tspan><tspan fill="#eef8ff">"PyTorch"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"scikit-learn"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"NumPy"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"YOLO / SAHI"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"RL"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"recommender systems"</tspan><tspan fill="#8fb3d9">]</tspan></text><text x="40" y="182" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1f5fa8">3</text><text x="80" y="182" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ffd85c">signals   </tspan><tspan fill="#8fb3d9">= [</tspan><tspan fill="#eef8ff">"MNE-Python"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"time-series analysis"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"spectral analysis"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"non-parametric stats"</tspan><tspan fill="#8fb3d9">]</tspan></text><text x="40" y="220" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1f5fa8">4</text><text x="80" y="220" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ffd85c">web       </tspan><tspan fill="#8fb3d9">= [</tspan><tspan fill="#eef8ff">"Flask"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Node.js"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Express"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"MongoDB"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"React"</tspan><tspan fill="#8fb3d9">]</tspan></text><text x="40" y="258" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1f5fa8">5</text><text x="80" y="258" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ffd85c">tools     </tspan><tspan fill="#8fb3d9">= [</tspan><tspan fill="#eef8ff">"Git"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Jupyter"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Kaggle"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"Figma"</tspan><tspan fill="#8fb3d9">, </tspan><tspan fill="#eef8ff">"VS Code"</tspan><tspan fill="#8fb3d9">]</tspan></text>
